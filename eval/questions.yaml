# 評測題目。資料來源是 simulate_day.py 的固定劇本（--adversarial，從 2026-01-01T06:00:00Z 起 24 小時）。
#
# 這個檔案**不含答案**：標準答案由 eval/ground_truth.py 依每題的 `truth` 從資料庫算出來。
#   category     answerable = 有確定答案；no_answer = 期望明確回答「無資料」
#   answer_type  int / float / bool / str（no_answer 題不需要）
#   tolerance    float 題的絕對誤差容許值（預設 1e-6）
#   truth        標準答案的算法（kind + 參數），見 ground_truth.py
#   oracle       腳本化 oracle 的做法：呼叫哪個工具、帶什麼參數、從結構化回傳的哪個欄位取答案
#                （extract 是以 . 分隔的路徑，數字代表清單索引）
# 「現在」指資料庫裡最新的一筆資料，不是牆上時鐘的現在。時間一律 UTC。

- id: alarms_day1_count
  question: ROBOT01 在 2026-01-01（UTC）發生了幾次低電量警報？
  category: answerable
  answer_type: int
  truth: {kind: alarm_count, equipment_id: ROBOT01, since: "2026-01-01T00:00:00Z", until: "2026-01-02T00:00:00Z"}
  oracle:
    tool: list_alarms
    args: {equipment_id: ROBOT01, since: "2026-01-01T00:00:00Z", until: "2026-01-02T00:00:00Z"}
    extract: total_count

