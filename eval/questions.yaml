  category: answerable   # 這一小時有資料、沒有警報：答案是 0，不是「無資料」
  answer_type: int
  truth: {kind: alarm_count, equipment_id: ROBOT01, since: "2026-01-01T06:00:00Z", until: "2026-01-01T07:00:00Z"}
  oracle:
    tool: list_alarms
    args: {equipment_id: ROBOT01, since: "2026-01-01T06:00:00Z", until: "2026-01-01T07:00:00Z"}
    extract: total_count

