  tolerance: 0.000001
  truth: {kind: daily_value, equipment_id: ROBOT01, day: "2026-01-01", column: availability}
  oracle:
    tool: get_utilization
    args: {equipment_id: ROBOT01, start_date: "2026-01-01", end_date: "2026-01-01"}
    extract: days.0.availability

